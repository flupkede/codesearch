[package]
name = "codesearch-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Shared library for codesearch: chunking, embeddings, retrieval, MCP protocol"

[lib]
name = "codesearch_core"
path = "src/lib.rs"

[features]
# Forwarded by the CLI package's cuda/tensorrt features.
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1"
regex = "1.12"
dashmap = "6.1"
dirs = "7"
# `longer-keys` raises LMDB's 511-byte key cap (SCIP symbols reach 900+ bytes);
# a build without it cannot read the long keys it writes.
heed = { version = "0.23", features = ["longer-keys"] }
ignore = "0.4"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = true }
thiserror = "2.0"
tokio = "1.40"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ML & Embeddings (embed/ + rerank/ moved in at stage 5)
fastembed = "7.0"
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "copy-dylibs"] }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
# openai.rs embedding provider HTTP (same pinned spec as the CLI's)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
httpdate = "1"

# MCP protocol layer (mcp/ moved in at stage 7): same specs as the CLI's.
# rmcp resolves through the workspace-root [patch.crates-io] to vendor/rmcp.
async-trait = "0.1"
rmcp = { version = "3.3.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "macros"] }
schemars = { version = "1.1.0", features = ["derive"] }

# Symbols (symbols/ moved in at stage 6)
# Wire-compat: use config::legacy() only — bincode-1 bytes on disk, pinned
# byte-exact by the golden tests in symbols/{csharp,typescript}.rs.
bincode = { version = "2.0", features = ["serde"] }
# SCIP symbol indexing — parses standard SCIP protobuf (.scip) emitted by
# Sourcegraph indexers (e.g. scip-typescript) for the TypeScript symbol adapter.
scip = "0.10"
protobuf = "3.7"

# Retrieval stores
arroy = "0.9"
tantivy = "0.27"
rand = "0.10"
fs2 = "0.4"

# Text processing & Parsing
tree-sitter = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-bash = "0.25.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.25.1"
tree-sitter-yaml = "0.7.2"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-dart = "0.3.0"
tree-sitter-proto = "0.6"

[dev-dependencies]
# federation's tests spin real axum echo/health servers
axum = "0.8"
ctor = "1.0"
serial_test = "4"
tempfile = "3.13"
