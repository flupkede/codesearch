[package]
name = "codesearch-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Shared library for codesearch: chunking, embeddings, retrieval, MCP protocol"

[lib]
name = "codesearch_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1"
dashmap = "6.1"
dirs = "7"
# `longer-keys` raises LMDB's 511-byte key cap (SCIP symbols reach 900+ bytes);
# a build without it cannot read the long keys it writes.
heed = { version = "0.23", features = ["longer-keys"] }
ignore = "0.4"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = true }
thiserror = "2.0"
tokio = "1.40"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
ctor = "1.0"
serial_test = "4"
tempfile = "3.13"
