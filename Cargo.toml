[package]
name = "codesearch"
version = "1.4.2"
edition = "2021"
authors = ["codesearch contributors"]
license = "Apache-2.0"
description = "Fast, local semantic code search powered by Rust"
repository = "https://github.com/flupkede/codesearch"
readme = "README.md"
keywords = ["search", "semantic", "grep", "embeddings", "code"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "codesearch"
path = "src/lib.rs"

[[bin]]
name = "codesearch"
path = "src/main.rs"

[dependencies]
# CLI & I/O
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
ctrlc = "3.4"
anyhow = "1.0"
thiserror = "2.0"

# ML & Embeddings
fastembed = "6.1"
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "copy-dylibs"] }
ndarray = "0.17"
hf-hub = "1.0"

# Vector DB (temporarily commented due to dep conflicts)
# lancedb = "0.5"

# Text processing & Parsing
tree-sitter = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-bash = "0.25.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-dart = "0.2.0"
tree-sitter-proto = "0.6"

# File handling
ignore = "0.4"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.7"
walkdir = "2.5"
fs2 = "0.4"  # Cross-platform file locking

# Caching
moka = { version = "0.12", features = ["sync"] }

# Search & Ranking
tantivy = "0.26"
regex = "1.12"

# Server
axum = "0.8"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Utilities
rayon = "1.10"
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sha2 = "0.11"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1"
indicatif = "0.17"
dirs = "7"
num_cpus = "1.16"
async-trait = "0.1"
# Vector database
arroy = "0.8"
heed = "0.22"
bincode = "1.3"
# SCIP symbol indexing — parses standard SCIP protobuf (.scip) emitted by
# Sourcegraph indexers (e.g. scip-typescript) for the TypeScript symbol adapter.
scip = "0.10"
protobuf = "3.7"
rand = "0.10"
# Aikido 34247111: 1.8.0 carries 5 advisories (CVE-2026-64684/317735/617985 + 2 more).
# 3.x keeps legacy initialize/session behavior by default (ProtocolVersion::LATEST stays
# V_2025_11_25); the 2026-07-28 stateless lifecycle is opt-in and NOT enabled here.
rmcp = { version = "3.3.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "macros"] }
schemars = { version = "1.1.0", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sysinfo = { version = "0.39", default-features = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.13"
pretty_assertions = "1.4"
serial_test = "3"

# Benchmarks will be added later
# [[bench]]
# name = "embedding_bench"
# harness = false
#
# [[bench]]
# name = "chunking_bench"
# harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[features]
default = []
cuda = ["ort/cuda"]        # Enable CUDA GPU acceleration (requires cuDNN)
tensorrt = ["ort/tensorrt"] # Enable TensorRT acceleration (NVIDIA only)
csharp_helper_integration = []  # Enable integration tests that require the scip-csharp helper binary
typescript_helper_integration = []  # Enable integration tests that require scip-typescript (npx or CODESEARCH_SCIP_TYPESCRIPT)
