[package]
name = "codesearch"
version = "1.7.20"
edition = "2021"
authors = ["codesearch contributors"]
license = "Apache-2.0"
description = "Fast, local semantic code search powered by Rust"
repository = "https://github.com/flupkede/codesearch"
readme = "README.md"
keywords = ["search", "semantic", "grep", "embeddings", "code"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "codesearch"
path = "src/lib.rs"

[[bin]]
name = "codesearch"
path = "src/main.rs"

[dependencies]
codesearch-core = { path = "core" }
# CLI & I/O
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
ctrlc = "3.4"
anyhow = { workspace = true }

# ML & Embeddings — moved to codesearch-core with the embed/rerank stack (stage 5);
# ndarray / hf-hub are gone from the root (transitive-only via fastembed)

# File handling
ignore = { workspace = true }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.7"

# Search & Ranking — tantivy moved to codesearch-core with fts/
regex = { workspace = true }

# Server
axum = { workspace = true }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Utilities
rayon = "1.10"
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
indicatif = "0.18"
dirs = { workspace = true }
num_cpus = "1.16"
async-trait = { workspace = true }
sha2 = { workspace = true }
# `longer-keys` builds LMDB with MDB_MAXKEYSIZE=0, so the key limit is derived
# from the page size (~1980 bytes on 4KB pages) instead of the 511-byte default.
# C# SCIP symbols carry fully qualified parameter types and reach 900+ bytes;
# at 511 a single such method failed the whole symbol rebuild. Note: a build
# WITHOUT this feature cannot read the long keys it writes.
heed = { workspace = true }
# Aikido 34247111: 1.8.0 carries 5 advisories (CVE-2026-64684/317735/617985 + 2 more).
# 3.x keeps legacy initialize/session behavior by default (ProtocolVersion::LATEST stays
# V_2025_11_25); the 2026-07-28 stateless lifecycle is opt-in and NOT enabled here.
rmcp = { workspace = true }
reqwest = { workspace = true }
sysinfo = { workspace = true }

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
colored = "3.1"
ctor = "1.0"
dashmap = "6.1"
dirs = "7"
heed = { version = "0.23", features = ["longer-keys"] }
ignore = "0.4"
regex = "1.12"
# Aikido 34247111: 1.8.0 carries 5 advisories (CVE-2026-64684/317735/617985 + 2 more).
# 3.x keeps legacy initialize/session behavior by default (ProtocolVersion::LATEST stays
# V_2025_11_25); the 2026-07-28 stateless lifecycle is opt-in and NOT enabled here.
rmcp = { version = "3.3.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serial_test = "4"
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = true }
tempfile = "3.13"
tokio = "1.40"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[patch.crates-io]
# Vendored copy of rmcp 3.5.0 with the [codesearch bridge] change in
# vendor/rmcp/src/service/server.rs (`negotiate_protocol_version`): it lets a
# session run at 2026-07-28 when the client offers that revision over the
# initialize handshake, so rmcp keeps the SEP-2322 `resultType` discriminator
# that Claude Code >= 2.1.296 requires. Re-apply the marked change when
# bumping rmcp.
rmcp = { path = "vendor/rmcp" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = { workspace = true }
serial_test = { workspace = true }
ctor = { workspace = true }
# start_paused time control in serve tests; was previously satisfied
# transitively by a fastembed/hf-hub tokio feature, now pinned.
tokio = { workspace = true, features = ["test-util"] }

# Benchmarks will be added later
# [[bench]]
# name = "embedding_bench"
# harness = false
#
# [[bench]]
# name = "chunking_bench"
# harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[features]
default = []
# GPU acceleration lives on codesearch-core (ort is a core dep); forwarded here
cuda = ["codesearch-core/cuda"]        # Enable CUDA GPU acceleration (requires cuDNN)
tensorrt = ["codesearch-core/tensorrt"] # Enable TensorRT acceleration (NVIDIA only)
csharp_helper_integration = []  # Enable integration tests that require the scip-csharp helper binary
typescript_helper_integration = []  # Enable integration tests that require scip-typescript (npx or CODESEARCH_SCIP_TYPESCRIPT)

[workspace]
resolver = "2"
members = ["core", "server"]
